<svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="triangleLogoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="triangleLogoTitle">Triangle — logo</title>

  <defs>
    <!-- Facet gradients: cool cyan-to-violet spectrum for a faceted crystal feel -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#3AA0FF" />
    </linearGradient>
    <linearGradient id="facetTopA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6FBFF" />
      <stop offset="100%" stop-color="#5CC6FF" />
    </linearGradient>
    <linearGradient id="facetTopB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CD6FF" />
      <stop offset="100%" stop-color="#2E7FFF" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6BFF" />
      <stop offset="100%" stop-color="#7A3CFF" />
    </linearGradient>
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7FFF" />
      <stop offset="100%" stop-color="#1B4FDB" />
    </linearGradient>
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7FFFE" />
      <stop offset="100%" stop-color="#7DF9FF" />
    </linearGradient>
    <linearGradient id="wordmarkFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AA0FF" />
      <stop offset="50%" stop-color="#7A3CFF" />
      <stop offset="100%" stop-color="#3AA0FF" />
    </linearGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#7DF9FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#7A3CFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft glow used behind the mark and along circuit traces -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient backdrop glow, sits behind the faceted mark -->
  <ellipse cx="200" cy="200" rx="170" ry="150" fill="#3AA0FF" opacity="0.18" filter="url(#softGlow)" />

  <!-- ===== Circuit traces extending from the triangle's vertices ===== -->
  <g stroke-linecap="round" fill="none">
    <!-- from apex -->
    <path d="M200,50 L200,18 L156,18" stroke="#7DF9FF" stroke-width="2.2" opacity="0.85" filter="url(#glow)" />
    <circle cx="156" cy="18" r="4.5" fill="#7DF9FF" filter="url(#glow)" />
    <path d="M200,50 L200,18 L244,18 L244,4" stroke="#7A3CFF" stroke-width="2.2" opacity="0.7" />
    <circle cx="244" cy="4" r="3.5" fill="#7A3CFF" />

    <!-- from bottom-left vertex -->
    <path d="M55,330 L18,330 L18,362 L40,362" stroke="#5CC6FF" stroke-width="2.2" opacity="0.85" filter="url(#glow)" />
    <circle cx="40" cy="362" r="4.5" fill="#5CC6FF" filter="url(#glow)" />
    <path d="M55,330 L18,330 L18,298" stroke="#3AA0FF" stroke-width="2" opacity="0.55" />
    <circle cx="18" cy="298" r="3.2" fill="#3AA0FF" />

    <!-- from bottom-right vertex -->
    <path d="M345,330 L382,330 L382,362 L360,362" stroke="#7A3CFF" stroke-width="2.2" opacity="0.85" filter="url(#glow)" />
    <circle cx="360" cy="362" r="4.5" fill="#7A3CFF" filter="url(#glow)" />
    <path d="M345,330 L382,330 L382,298" stroke="#2E7FFF" stroke-width="2" opacity="0.55" />
    <circle cx="382" cy="298" r="3.2" fill="#2E7FFF" />

    <!-- fine circuit branch across the base -->
    <path d="M150,346 L150,368 L250,368 L250,346" stroke="#5B6BFF" stroke-width="1.6" opacity="0.4" />
    <circle cx="150" cy="368" r="2.6" fill="#5B6BFF" opacity="0.7" />
    <circle cx="250" cy="368" r="2.6" fill="#5B6BFF" opacity="0.7" />
  </g>

  <!-- ===== Faceted low-poly triangle mark ===== -->
  <!-- Outer vertices: apex A(200,50) base-left B(55,330) base-right C(345,330) -->
  <!-- Inner split points create the faceted / crystalline subdivisions -->
  <g stroke="#0B1220" stroke-width="1" stroke-opacity="0.25">
    <!-- left wing -->
    <polygon points="55,330 127.5,190 145,270" fill="url(#facetLeft)" />
    <polygon points="55,330 145,270 200,330" fill="url(#facetLeft)" opacity="0.85" />

    <!-- right wing -->
    <polygon points="345,330 272.5,190 255,270" fill="url(#facetRight)" />
    <polygon points="345,330 255,270 200,330" fill="url(#facetRight)" opacity="0.85" />

    <!-- upper facets -->
    <polygon points="200,50 127.5,190 163,150" fill="url(#facetTopA)" />
    <polygon points="200,50 163,150 200,190" fill="url(#facetTop)" />
    <polygon points="200,50 200,190 237,150" fill="url(#facetTopB)" />
    <polygon points="200,50 237,150 272.5,190" fill="url(#facetTopB)" opacity="0.9" />

    <!-- connecting shard between upper and wings -->
    <polygon points="127.5,190 163,150 200,190" fill="url(#facetTop)" opacity="0.75" />
    <polygon points="272.5,190 237,150 200,190" fill="url(#facetTopB)" opacity="0.75" />
    <polygon points="127.5,190 200,190 145,270" fill="url(#facetLeft)" opacity="0.65" />
    <polygon points="272.5,190 200,190 255,270" fill="url(#facetRight)" opacity="0.65" />

    <!-- luminous core facet -->
    <polygon points="200,190 145,270 200,330 255,270" fill="url(#facetCenter)" opacity="0.9" />
  </g>

  <!-- crisp edge lines on top of the facets for a cut-glass finish -->
  <g fill="none" stroke="#EAFBFF" stroke-width="1.1" stroke-opacity="0.55" stroke-linejoin="round">
    <polygon points="200,50 55,330 345,330" />
    <line x1="127.5" y1="190" x2="272.5" y2="190" />
    <line x1="145" y1="270" x2="255" y2="270" />
    <line x1="163" y1="150" x2="237" y2="150" />
    <line x1="200" y1="50" x2="200" y2="330" stroke-opacity="0.3" />
    <line x1="127.5" y1="190" x2="200" y2="330" stroke-opacity="0.3" />
    <line x1="272.5" y1="190" x2="200" y2="330" stroke-opacity="0.3" />
  </g>

  <!-- node points at every facet intersection, echoing a circuit-board grid -->
  <g fill="#FFFFFF">
    <circle cx="200" cy="50" r="4" filter="url(#glow)" />
    <circle cx="55" cy="330" r="4" filter="url(#glow)" />
    <circle cx="345" cy="330" r="4" filter="url(#glow)" />
    <circle cx="127.5" cy="190" r="3" opacity="0.9" />
    <circle cx="272.5" cy="190" r="3" opacity="0.9" />
    <circle cx="200" cy="190" r="3.4" opacity="0.95" />
    <circle cx="163" cy="150" r="2.4" opacity="0.8" />
    <circle cx="237" cy="150" r="2.4" opacity="0.8" />
    <circle cx="145" cy="270" r="2.4" opacity="0.8" />
    <circle cx="255" cy="270" r="2.4" opacity="0.8" />
    <circle cx="200" cy="330" r="3" opacity="0.9" />
  </g>

  <!-- ===== Wordmark ===== -->
  <text
    x="200"
    y="440"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="42"
    letter-spacing="10"
    fill="url(#wordmarkFill)"
  >TRIANGLE</text>

  <rect x="90" y="462" width="220" height="2.4" fill="url(#underline)" />

  <text
    x="200"
    y="488"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="13"
    letter-spacing="4"
    fill="#5CC6FF"
    opacity="0.75"
  >SYSTEMS · BEYOND · FORM</text>
</svg>
