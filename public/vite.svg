<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glowing triangle (green) -->
  <polygon points="200,40 60,340 340,340"
           fill="none"
           stroke="limegreen"
           stroke-width="16"
           filter="url(#glow)" />

  <!-- Inner hollow triangle -->
  <polygon points="200,80 100,320 300,320"
           fill="white" />

  <!-- White parallelogram (left) -->
  <polygon points="130,320 160,320 145,345 115,345"
           fill="white" />

  <!-- Blue parallelogram (right) -->
  <polygon points="240,320 270,320 255,345 225,345"
           fill="dodgerblue" />

  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="limegreen" flood-opacity="1" />
    </filter>
  </defs>
</svg>
